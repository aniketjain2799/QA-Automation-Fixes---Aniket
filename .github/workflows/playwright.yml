name: Playwright Github Actions

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
   workflow_dispatch:

jobs:
  build:
    timeout-minutes: 360
    runs-on: ubuntu-22.04
    env:
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install node js v20
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install

      - name: Debug Environment Variables
        run: |
          echo "Running tests with TAGS: @Regression"
          export npm_config_TAGS="@Regression"

      - name: Run Cucumber tests with TAG
        run: |
          export npm_config_TAGS="@Regression"
          SECRET_KEY=King1207# npm run test:staging -- --TAGS="@Regression"

      - name: Wait for job completion
        run: sleep 10s
        if: always()

      - name: Check if HTML report exists
        run: |
          if [ -f "test-results/cucumber-report.html" ]; then
            echo "Cucumber report exists."
          else
            echo "Cucumber report does not exist. Exiting...."
            exit 1
          fi
        if: always()

      - name: Upload Cucumber report as artifact
        uses: actions/upload-artifact@v4.3.3
        with:
          name: cucumber-report
          path: test-results/cucumber-report.html
          if-no-files-found: error
        if: always()

      
      - name: Generate artifact link
        id: artifact_link
        run: echo "::set-output name=artifact_url::https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        if: always()

      
      - name: Send Teams notification
        run: |
          MESSAGE="Hi Team, Please find the latest Readibots WebAutomation Report for Stage environment.
          To download the report:
          1. Make sure you are logged into the Automation GitHub repository.
          2. Scroll to the bottom of the page.
          3. Click on 'Download report'.
  
          Click on this link to access the artifact: [Download Report](${{ steps.artifact_link.outputs.artifact_url }})"
          curl -H 'Content-Type: application/json' -d '{
            "text": "'"$MESSAGE"'"
          }' ${{ secrets.TEAMS_WEBHOOK_URL }}
        if: always()